<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Geo's digital contact landing page">
    <title>Geo | Contact</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

   
    <script>
        const personalInfo = {
            name: "Geo", // <-- PUT YOUR NAME HERE
            phone: "+63 0991 930 4983", // <-- INPUT YOUR CONTACT NUMBER HERE
            personalGmail: "ladicafredrick@gmail.com", // <-- INPUT YOUR PERSONAL GMAIL HERE
            businessGmail: "greview.ph@gmail.com", // <-- INPUT YOUR BUSINESS GMAIL HERE
            instagram: "https://www.instagram.com/greview.ph/", // <-- INPUT YOUR INSTAGRAM LINK HERE
            tiktok: "https://www.tiktok.com/@greview.ph", // <-- INPUT YOUR TIKTOK LINK HERE
            facebook: "https://www.facebook.com/greview.ph" // <-- INPUT YOUR FACEBOOK PAGE HERE
        };
    </script>

    <!-- Moving background -->
    <div class="background">
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="glow glow-three"></div>
    </div>

    <!-- Opening animation -->
    <section class="intro" id="intro">
        <div class="intro-content">
            <p class="small-label">DIGITAL CONTACT CARD</p>
            <h1>Welcome.</h1>
            <p class="intro-name">My name is <span id="introName">Geo</span>.</p>
            <div class="loading-line">
                <span></span>
            </div>
        </div>
    </section>

    <!-- Main landing page -->
    <main class="page" id="mainPage">

        <section class="hero">

            <div class="badge">DIGITAL CONTACT CARD</div>

            <h1>
                Welcome,<br>
                <span>My name is <span id="mainName">Geo</span>.</span>
            </h1>

            <p class="subtitle">
                Contact me below.
            </p>

            <!-- =====================================================
                 PROFILE IMAGE
                 PUT YOUR IMAGE INSIDE THE "images" FOLDER.
                 Example:
                 images/profile.jpg

                 Then change the src below to:
                 src="images/profile.jpg"
                 ===================================================== -->
            <div class="profile-wrapper">
                <div class="profile-ring"></div>

                <img
                    id="profileImage"
                    src="images/image.jpg"
                    alt="Geo's profile"
                    onerror="this.style.display='none'; document.getElementById('imagePlaceholder').style.display='flex';"
                >

                <div id="imagePlaceholder" class="image-placeholder">
                    <span>YOUR<br>IMAGE</span>
                </div>
            </div>

            <p class="hint">Tap a button to connect</p>

            <!-- Contact buttons -->
            <div class="contact-buttons">

                <!-- PHONE -->
                <div class="contact-item">
                    <button class="contact-btn" onclick="toggleMenu('phoneMenu', this)">
                        <span class="icon">☎</span>
                        <span>
                            <strong>Contact Number</strong>
                            
                        </span>
                        <span class="arrow">↗</span>
                    </button>

                    <div class="action-menu" id="phoneMenu">
                        <button onclick="callNumber()">Call Number</button>
                        <button onclick="saveContact()">Save Number</button>
                    </div>
                </div>

                <!-- INSTAGRAM -->
                <div class="contact-item">
                    <button class="contact-btn" onclick="toggleMenu('instagramMenu', this)">
                        <span class="icon">◎</span>
                        <span>
                            <strong>Instagram</strong>
                          
                        </span>
                        <span class="arrow">↗</span>
                    </button>

                    <div class="action-menu" id="instagramMenu">
                        <button onclick="openInstagram()">Open Instagram</button>
                        <button onclick="copyInstagram()">Copy Link</button>
                    </div>
                </div>

                <!-- TIKTOK -->
                <div class="contact-item">
                    <button class="contact-btn" onclick="toggleMenu('tiktokMenu', this)">
                        <span class="icon">♪</span>
                        <span>
                            <strong>TikTok</strong>
                            
                        </span>
                        <span class="arrow">↗</span>
                    </button>

                    <div class="action-menu" id="tiktokMenu">
                        <button onclick="openTikTok()">Open TikTok</button>
                        <button onclick="copyTikTok()">Copy Link</button>
                    </div>
                </div>

                <!-- PERSONAL GMAIL -->
                <div class="contact-item">
                    <button class="contact-btn" onclick="toggleMenu('personalMailMenu', this)">
                        <span class="icon">@</span>
                        <span>
                            <strong>Personal Gmail</strong>
                            
                        </span>
                        <span class="arrow">↗</span>
                    </button>

                    <div class="action-menu" id="personalMailMenu">
                        <button onclick="emailPersonal()">Send Email</button>
                        <button onclick="copyPersonalEmail()">Copy Gmail</button>
                    </div>
                </div>

                <!-- BUSINESS GMAIL -->
                <div class="contact-item">
                    <button class="contact-btn" onclick="toggleMenu('businessMailMenu', this)">
                        <span class="icon">@</span>
                        <span>
                            <strong>Business Gmail</strong>
                            
                        </span>
                        <span class="arrow">↗</span>
                    </button>

                    <div class="action-menu" id="businessMailMenu">
                        <button onclick="emailBusiness()">Send Business Email</button>
                        <button onclick="copyBusinessEmail()">Copy Gmail</button>
                    </div>
                </div>

                <!-- FACEBOOK -->
<div class="contact-item">
    <button class="contact-btn" onclick="toggleMenu('facebookMenu', this)">
        <span class="icon">f</span>
        <span>
            <strong>Facebook</strong>
        </span>
        <span class="arrow">↗</span>
    </button>

    <div class="action-menu" id="facebookMenu">
        <button onclick="openFacebook()">Open Facebook</button>
        <button onclick="copyFacebook()">Copy Link</button>
    </div>
</div>
                

            </div>

            <footer>
                <span>Made by  <strong id="footerName">Geo</strong></span>
                <span>•</span>
                <span>Digital Contact Card</span>
            </footer>

        </section>
    </main>

    <!-- Toast message -->
    <div class="toast" id="toast">Copied!</div>

    <script src="script.js"></script>
</body>
</html>
